# Run every check of this repository (tests/check.sh) on each push and pull
# request. macOS only: the install is measured on one Mac (see the README).
# python3 and shellcheck come from the flake's own pinned nixpkgs.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: tests/check.sh
        run: >
          nix shell --no-write-lock-file --inputs-from . nixpkgs#python3 nixpkgs#shellcheck
          -c bash tests/check.sh

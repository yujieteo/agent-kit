<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
/* Tokens from https://teoyujie.org/style.css (which takes them from emilkowal.ski). Light only, as the site is.
   c1-c4 are the site's series colours. c5 and c6 are the same Radix step-11 scale, for a beat with over 4 terms. */
@font-face { font-family: "Inter"; src: url(../assets/fonts/inter.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "IBM Plex Mono"; src: url(../assets/fonts/ibm-plex-mono.woff2) format("woff2"); font-weight: 400; }
:root { --bg: #fdfdfc; --chip: #f9f9f8; --line: #e9e9e7; --ahead: #8d8d86; --muted: #63635e; --ink: #21201c;
  --c1: #0d74ce; --c2: #cc4e00; --c3: #6550b9; --c4: #2a7e3b; --c5: #cb1d63; --c6: #107d98;
  --edge: 128px; --fs: 46px; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: "Inter", Arial, sans-serif;
  font-feature-settings: "liga" 1, "calt" 1, "cv01", "ss03"; -webkit-font-smoothing: antialiased; }
header, footer { position: absolute; left: var(--edge); right: var(--edge); font-size: 25px; line-height: 1.5; }
header { top: 60px; display: flex; justify-content: space-between; gap: 48px; }
.name { font-weight: 500; white-space: nowrap; }
.sec { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
footer { bottom: 56px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 2px; background: var(--line); margin-bottom: 16px; border-radius: 2px; }
.bar i { display: block; height: 2px; background: var(--ink); border-radius: 2px; }
.foot { display: flex; justify-content: space-between; }
main { position: absolute; left: var(--edge); right: var(--edge); top: 140px; bottom: 150px; display: flex; align-items: center; }
#beat { width: 100%; font-size: var(--fs); }
/* A beat with a figure ('@fig' in the beats): the figure on the left, the words on the right. */
main.withfig { left: 72px; right: 96px; display: grid; grid-template-columns: 880px 1fr; column-gap: 64px; align-items: center; }
#fig { width: 880px; height: 790px; }
#fig svg { width: 100%; height: 100%; display: block; }
#fig .lab { color: var(--ink); }
#fig .p.x { opacity: 0; }               /* a part drawn only when a beat points to it */
main.withfig .card h1 { font-size: 64px; }
main.withfig .card .by, main.withfig .card .how { font-size: 30px; }
/* The text of the source: ink. A definition: its term's colour, once the voice gets to it. */
p.s { margin: 0; line-height: 1.74; font-weight: 450; letter-spacing: -0.011em; text-wrap: pretty; overflow-wrap: break-word; }
p.narr { color: var(--muted); font-weight: 400; }
.t { color: var(--c); font-weight: 500; padding: 0.07em 0.4em 0.09em; margin: 0 0.03em; border-radius: 999px;
  background: color-mix(in srgb, var(--c) 7%, transparent); box-shadow: inset 0 0 0 0.05em var(--c);
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.t0 { color: var(--ink); font-weight: 450; background: none; box-shadow: inset 0 0 0 0.04em color-mix(in srgb, var(--ahead) 60%, transparent); }
.d { font-weight: 400; color: color-mix(in srgb, var(--c) calc(var(--p) * 100%), var(--ahead)); }
.d .k { color: color-mix(in srgb, var(--muted) calc(var(--p) * 100%), var(--ahead)); }
.nw { white-space: nowrap; }
.h { text-decoration: underline; text-decoration-thickness: 0.05em; text-underline-offset: 0.2em; }
/* The page after a sentence: the meaning of each word that its definitions use. The word is bold, in its term's colour. */
p.more { font-weight: 400; line-height: 1.66; }
p.more .d { display: block; margin-bottom: 0.42em; }
.d b { font-weight: 600; }
p.more .d.sub { padding-left: 1.3em; }      /* a word that the meaning above it uses */
img { display: inline-block; margin: 0 -0.05em; }
/* A formula inside a meaning: the SVG is a mask, so the formula has the colour of the words around it. */
.fm { display: inline-block; margin: 0 -0.05em; background: currentColor; -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
.dm { display: block; text-align: center; margin: 0.5em 0 0.45em; }
.dm img { max-width: 100%; object-fit: contain; }   /* a display wider than the column shrinks to fit, never overflows */
.eyebrow { font-size: 25px; line-height: 1.5; color: var(--muted); margin-bottom: 20px; }
.card h1 { margin: 0; font-size: 84px; line-height: 1.14; font-weight: 600; letter-spacing: -0.03em; text-wrap: balance; max-width: 1500px; }
.card .by { margin-top: 28px; font-size: 34px; color: var(--muted); }
.card .how { margin-top: 72px; font-size: 34px; font-weight: 450; }
</style>
<body><div id="root"></div>
<script>
// Put one frame on the page. The text gets the largest size that fits; every state of a beat lays out the same,
// because states change colour and opacity only, never the box of any word.
const SIZES = [46, 42, 38, 35, 32, 29, 26, 23, 20];
async function setFrame(html) {
  const root = document.getElementById("root");
  root.innerHTML = html;
  await document.fonts.ready;
  await Promise.all([...root.querySelectorAll("img")].map(i => i.decode().catch(() => {})));
  const beat = document.getElementById("beat"), room = beat.parentElement.clientHeight;
  for (const s of SIZES) {
    document.documentElement.style.setProperty("--fs", s + "px");
    if (beat.scrollHeight <= room) break;
  }
  return beat.scrollHeight <= room;
}
</script>
</html>

# The keys of $CODEX_HOME/config.toml that are the user's choice. Codex owns
# the rest of that file. `agent-kit install` sets these keys and keeps every
# other line; `agent-kit verify` fails when one has another value.
model = "gpt-6.2-astra"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
memories = false

[memories]
generate_memories = false
use_memories = false
